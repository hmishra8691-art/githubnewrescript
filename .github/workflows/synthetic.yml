name: synthetic-check

# P1-13 (audit 2026-11-17): the deployed apps' health and one live survey link, every 15 minutes.
# Inert until the repository secrets are set: STUDIO_URL, RUNTIME_URL, INTERVIEWS_URL, SYNTHETIC_LIVE_LINK (any of
# them) and ALERT_WEBHOOK_URL (where a failure is posted).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/synthetic-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synthetic check
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          RUNTIME_URL: ${{ secrets.RUNTIME_URL }}
          INTERVIEWS_URL: ${{ secrets.INTERVIEWS_URL }}
          SYNTHETIC_LIVE_LINK: ${{ secrets.SYNTHETIC_LIVE_LINK }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/synthetic-check.mjs
